<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORTAL AULAS CAVIGA PEI</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #020617;
    color: white;
    font-family: 'Inter';
}

/* HEADER */
header {
    font-family: 'Bebas Neue';
    font-size: 22px;
    padding: 15px 20px;
    color: #94a3b8;
}

/* TITULOS */
h2 {
    font-family: 'Bebas Neue';
    margin: 20px 20px 10px;
    font-size: 26px;
}

/* BANNER */
#banner {
    position: relative;
    height: 300px;
    margin: 20px;
    border-radius: 12px;
    overflow: hidden;
}

#banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: bannerImpacto 25s ease-in-out infinite alternate;
}

@keyframes bannerImpacto {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
}

/* FILTROS */
.filtros {
    display: flex;
    gap: 15px;
    padding: 0 20px 20px;
}

select {
    background: #020617;
    border: 1px solid #334155;
    color: white;
    padding: 10px;
    border-radius: 8px;
}

/* LINHA */
.linha {
    position: relative;
}

/* SETAS */
.seta {
    position: absolute;
    top: 60%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    font-size: 22px;
    backdrop-filter: blur(6px);
    transition: 0.3s;
}

.seta:hover {
    background: #22c55e;
    transform: translateY(-50%) scale(1.1);
}

.seta.esq { left: 10px; }
.seta.dir { right: 10px; }

/* CARDS */
.cards {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding: 10px 20px;
    min-height: 160px;
    scroll-snap-type: x mandatory;

    scrollbar-width: none;
}

.cards::-webkit-scrollbar {
    display: none;
}

.card {
    min-width: 240px;
    height: 140px;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    background-size: cover;
    transition: 0.4s;
    scroll-snap-align: start;
}

/* efeito netflix */
.cards:hover .card {
    opacity: 0.4;
}

.cards .card:hover {
    opacity: 1;
    transform: scale(1.2) translateY(-10px);
    z-index: 20;
    border: 2px solid #22c55e;
}

/* TEXTO */
.info {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;

    font-size: 12px;
    font-weight: 500;
    color: #020617;

    background: rgba(255,255,255,0.85); /* 🔥 fundo branco */
    padding: 6px 8px;
    border-radius: 6px;

    line-height: 1.3;
}

.info span {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.info strong {
    color: #020617; /* preto elegante */
    font-size: 13px;
    font-weight: 600;
}
/* BOTÕES */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.validar { background: #22c55e; }
.fechar { background: #ef4444; }

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.modal-content {
    position: relative;
    padding: 30px;
    border-radius: 12px;
    width: 500px;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    background-size: cover;
}

.modal-content::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(2,6,23,0.85);
}

.modal-content * {
    position: relative;
    z-index: 2;
}

body.modal-aberto #app {
    filter: blur(5px);
}

</style>
</head>

<body>
<div id="banner">
    <img src="banner.jpg">
</div>

<div class="filtros">
<select id="filtroTurma"><option value="">Todas Turmas</option></select>
<select id="filtroBimestre"><option value="">Todos Bimestres</option></select>
</div>

<div id="app"></div>

<div class="modal" id="modal">
  <div class="modal-content">
        <h2 id="titulo"></h2>
        <p id="conteudo"></p>
        <p id="objetivo"></p>
        <button class="validar" id="validar">Validar Aula</button>
        <button class="fechar" onclick="fechar(event)">Fechar</button>
  </div>
</div>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVoFCWaCEvp3tOKpXKzY4hdAE6-UbjKqBSvdn6QDd9a2628jy9LitO7a2CiUJdTy9D24q1LSytW4-i/pub?output=csv";

const imagens = {
"Português": "img/portugues.png",
"Matemática": "img/matematica.png",
"Ciências": "img/ciencias.png",
"Geografia": "img/geografia.png",
"História": "img/historia.png",
"Arte": "img/artes.png",
"Educação Física": "img/educacao_fisica.png",
"Inglês": "img/ingles.png",
"Física": "img/fisica.png",
"Química": "img/quimica.png",
"Biologia": "img/biologia.png",
"Sociologia": "img/sociologia.png",
"Filosofia": "img/filosofia.png"
};

let todas=[];

fetch(sheetURL)
.then(r=>r.text())
.then(t=>{
const linhas = t.split("\n").slice(1);

const dados = linhas.map(l=>{
const c = l.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
if(!c) return null;

return {
turma:(c[2]+" "+c[0]).replace(/"/g,'').trim(),
materia:c[1].replace(/"/g,'').trim(),
bimestre:c[3].replace(/"/g,'').trim(),
aula:c[4].replace(/"/g,'').trim(),
nome:c[5].replace(/"/g,'').trim(),
conteudo:c[6]?.replace(/"/g,'').trim(),
objetivo:c[7]?.replace(/"/g,'').trim(),
form:c[8]
}
}).filter(Boolean);

todas=dados;

[...new Set(dados.map(a=>a.turma))].forEach(x=>{
filtroTurma.innerHTML+=`<option>${x}</option>`;
});

[...new Set(dados.map(a=>a.bimestre))].forEach(x=>{
filtroBimestre.innerHTML+=`<option>${x}</option>`;
});

render(dados);
});

function aplicarFiltros(){
render(todas.filter(a=>
(!filtroTurma.value||a.turma==filtroTurma.value)&&
(!filtroBimestre.value||a.bimestre==filtroBimestre.value)
));
}

filtroTurma.onchange=aplicarFiltros;
filtroBimestre.onchange=aplicarFiltros;

function render(d){
app.innerHTML="";
const materias=[...new Set(d.map(a=>a.materia))];

materias.forEach(m=>{
const row=document.createElement("div");
row.className="linha";

row.innerHTML=`
<h2>${m}</h2>
<div class="seta esq">‹</div>
<div class="seta dir">›</div>
`;

const box=document.createElement("div");
box.className="cards";

d.filter(a=>a.materia==m).forEach(a=>{
const card=document.createElement("div");
card.className="card";

card.style.backgroundImage=`url(${imagens[m]})`;

card.innerHTML = `
<div class="info">
<div class="aula">Aula ${a.aula}</div>
<div class="titulo">${a.nome}</div>
</div>
`;
card.onclick=()=>abrir(a);

box.appendChild(card);
});

row.appendChild(box);
app.appendChild(row);

const esq=row.querySelector(".esq");
const dir=row.querySelector(".dir");

esq.onclick=()=>box.scrollBy({left:-300,behavior:"smooth"});
dir.onclick=()=>box.scrollBy({left:300,behavior:"smooth"});
});
}

function abrir(aula){
modal.style.display="flex";
document.body.classList.add("modal-aberto");

titulo.innerText=aula.nome;
conteudo.innerHTML="<b>Conteúdo:</b><br>"+aula.conteudo;
objetivo.innerHTML="<br><b>Objetivo:</b><br>"+aula.objetivo;

document.querySelector(".modal-content").style.backgroundImage =
`url(${imagens[aula.materia]})`;

validar.onclick=()=>window.open(aula.form);
}

function fechar(e){
if(e) e.stopPropagation();
modal.style.display="none";
document.body.classList.remove("modal-aberto");
}

modal.addEventListener("click", fechar);
document.querySelector(".modal-content").onclick=(e)=>e.stopPropagation();

</script>

</body>
</html>
